[project]
name = "evalfleet"
version = "0.1.0"
description = "A monitor for a fleet of evaluations across the checkpoints of a training run, validated on real runs with injected faults."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalfleet = "evalfleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: every run here is sized to train in about a minute without a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
